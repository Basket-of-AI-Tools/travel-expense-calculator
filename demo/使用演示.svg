    <path d="M92 663h1256" stroke="#e2e8f0"/>
    <rect x="92" y="676" width="1256" height="42" rx="6" fill="#f0fdfa"/>
    <g fill="#0f172a" font-size="15"><text x="110" y="703">2026-05-02</text><text x="218" y="703">主题咖啡馆</text><text x="390" y="703">餐饮</text><text x="530" y="703">示例商户 C</text><text x="720" y="703">1,400.00</text><text x="855" y="703">JPY</text><text x="955" y="703">¥67.20</text><text x="1110" y="703">按演示汇率换算</text></g>

    <rect x="92" y="735" width="1256" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="112" y="769" fill="#0f172a" font-size="19" font-weight="700">在下方填写一笔花费</text>
    <g fill="#64748b" font-size="14"><text x="112" y="802">日期</text><text x="256" y="802">项目</text><text x="442" y="802">类别</text><text x="600" y="802">原币金额</text><text x="738" y="802">币种</text><text x="850" y="802">汇率</text><text x="1008" y="802">商家/地点</text><text x="1195" y="802">备注</text></g>
    <g fill="#ffffff" stroke="#cbd5e1"><rect x="112" y="811" width="124" height="42" rx="6"/><rect x="256" y="811" width="170" height="42" rx="6"/><rect x="442" y="811" width="146" height="42" rx="6"/><rect x="600" y="811" width="120" height="42" rx="6"/><rect x="738" y="811" width="94" height="42" rx="6"/><rect x="850" y="811" width="142" height="42" rx="6"/><rect x="1008" y="811" width="171" height="42" rx="6"/><rect x="1195" y="811" width="133" height="42" rx="6"/></g>
    <g fill="#334155" font-size="15"><text x="124" y="838">2026-05-03</text><text x="268" y="838">午餐</text><text x="454" y="838">餐饮</text><text x="612" y="838">38.00</text><text x="750" y="838">CNY</text><text x="862" y="838">1</text><text x="1020" y="838">示例餐厅</text><text x="1207" y="838">示例</text></g>
    <g><rect x="112" y="874" width="94" height="38" rx="7" fill="#0f766e"/><text x="159" y="899" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei UI, sans-serif" font-size="15" font-weight="700">新增</text><rect x="220" y="874" width="120" height="38" rx="7" fill="#ffffff" stroke="#94a3b8"/><text x="280" y="899" text-anchor="middle" fill="#334155" font-family="Microsoft YaHei UI, sans-serif" font-size="15">保存修改</text><rect x="354" y="874" width="120" height="38" rx="7" fill="#ffffff" stroke="#94a3b8"/><text x="414" y="899" text-anchor="middle" fill="#334155" font-family="Microsoft YaHei UI, sans-serif" font-size="15">清空输入</text><rect x="1022" y="874" width="306" height="38" rx="7" fill="#ccfbf1"/><text x="1175" y="899" text-anchor="middle" fill="#0f766e" font-family="Microsoft YaHei UI, sans-serif" font-size="15" font-weight="700">实时换算预览：CNY ¥38.00</text></g>
