  <g font-family="Microsoft YaHei UI, sans-serif">
    <rect x="72" y="1010" width="1296" height="270" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <text x="105" y="1060" fill="#0f172a" font-size="25" font-weight="700">最后一步：打开汇总报表</text>
    <text x="105" y="1097" fill="#475569" font-size="18">点击窗口顶部的「打开互动汇总」，程序会更新并打开本地 HTML 报表。</text>
    <rect x="105" y="1120" width="360" height="125" rx="14" fill="#f0fdfa"/>
    <text x="132" y="1157" fill="#0f766e" font-size="16" font-weight="700">虚构演示行程总额</text>
    <text x="132" y="1211" fill="#0f172a" font-size="42" font-weight="700">¥839.20</text>
    <rect x="490" y="1120" width="838" height="125" rx="14" fill="#f8fafc"/>
    <g fill="#334155" font-size="17"><text x="520" y="1157">交通　¥32.00</text><text x="745" y="1157">住宿　¥680.00</text><text x="985" y="1157">景点/活动　¥60.00</text><text x="520" y="1200">餐饮　¥67.20</text><text x="745" y="1200">数据文件：travel-data.json</text><text x="1055" y="1200">报表：旅行花费汇总.html</text></g>
    <text x="72" y="1332" fill="#64748b" font-family="Microsoft YaHei UI, sans-serif" font-size="16">以上为操作界面示意图，内容取自虚构样例；软件数据保存在软件目录中，不会上传。</text>
