    <rect x="1084" y="405" width="145" height="40" rx="8" fill="#0f766e"/><text x="1156" y="431" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">打开互动汇总</text>
    <rect x="1241" y="405" width="112" height="40" rx="8" fill="#ffffff" stroke="#0f766e"/><text x="1297" y="431" text-anchor="middle" fill="#0f766e" font-size="15" font-weight="700">新建/重置</text>

    <rect x="92" y="468" width="1256" height="45" rx="6" fill="#f1f5f9"/>
