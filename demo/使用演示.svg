    <g fill="#0f172a" font-size="15"><text x="110" y="548">2026-05-01</text><text x="218" y="548">市内交通</text><text x="390" y="548">交通</text><text x="530" y="548">示例商户 A</text><text x="720" y="548">32.00</text><text x="855" y="548">CNY</text><text x="955" y="548">¥32.00</text><text x="1110" y="548">虚构演示数据</text></g>
    <path d="M92 565h1256" stroke="#e2e8f0"/>
    <g fill="#0f172a" font-size="15"><text x="110" y="597">2026-05-01</text><text x="218" y="597">示例住宿</text><text x="390" y="597">住宿</text><text x="530" y="597">示例商户 B</text><text x="720" y="597">680.00</text><text x="855" y="597">CNY</text><text x="955" y="597">¥680.00</text><text x="1110" y="597">虚构演示数据</text></g>
    <path d="M92 614h1256" stroke="#e2e8f0"/>
