<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1400" viewBox="0 0 1440 1400" role="img" aria-labelledby="title desc">
  <title id="title">旅行花费计算器新手操作图</title>
  <desc id="desc">展示启动程序、录入旅行花费、自动保存、查看汇总报表的操作步骤。界面和数据为示意。</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1440" height="1400" fill="#f1f5f9"/>
  <rect x="0" y="0" width="1440" height="215" fill="url(#hero)"/>
  <text x="72" y="76" fill="#ccfbf1" font-family="Microsoft YaHei UI, sans-serif" font-size="20" font-weight="700">便携软件 · 新手操作图</text>
  <text x="72" y="137" fill="#ffffff" font-family="Microsoft YaHei UI, sans-serif" font-size="46" font-weight="700">旅行花费计算器</text>
  <text x="74" y="180" fill="#e6fffb" font-family="Microsoft YaHei UI, sans-serif" font-size="22">双击启动 → 填写一笔花费 → 自动换算 → 打开旅行汇总</text>
  <rect x="1150" y="55" width="210" height="50" rx="25" fill="#ffffff" fill-opacity=".18"/>
  <text x="1255" y="87" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei UI, sans-serif" font-size="18" font-weight="700">离线运行 · 本地保存</text>

  <g font-family="Microsoft YaHei UI, sans-serif">
    <g filter="url(#shadow)"><rect x="72" y="245" width="306" height="116" rx="18" fill="#ffffff"/><rect x="400" y="245" width="306" height="116" rx="18" fill="#ffffff"/><rect x="728" y="245" width="306" height="116" rx="18" fill="#ffffff"/><rect x="1056" y="245" width="312" height="116" rx="18" fill="#ffffff"/></g>
    <circle cx="112" cy="285" r="22" fill="#ccfbf1"/><text x="112" y="293" text-anchor="middle" fill="#0f766e" font-size="22" font-weight="700">1</text>
    <text x="148" y="283" fill="#0f172a" font-size="21" font-weight="700">启动</text><text x="148" y="319" fill="#475569" font-size="17">解压后双击旅行花费计算器.exe</text>
    <circle cx="440" cy="285" r="22" fill="#ccfbf1"/><text x="440" y="293" text-anchor="middle" fill="#0f766e" font-size="22" font-weight="700">2</text>
    <text x="476" y="283" fill="#0f172a" font-size="21" font-weight="700">填写</text><text x="476" y="319" fill="#475569" font-size="17">日期、项目、金额、币种等</text>
    <circle cx="768" cy="285" r="22" fill="#ccfbf1"/><text x="768" y="293" text-anchor="middle" fill="#0f766e" font-size="22" font-weight="700">3</text>
    <text x="804" y="283" fill="#0f172a" font-size="21" font-weight="700">新增</text><text x="804" y="319" fill="#475569" font-size="17">点击新增，记录自动保存在本机</text>
    <circle cx="1096" cy="285" r="22" fill="#ccfbf1"/><text x="1096" y="293" text-anchor="middle" fill="#0f766e" font-size="22" font-weight="700">4</text>
    <text x="1132" y="283" fill="#0f172a" font-size="21" font-weight="700">查看</text><text x="1132" y="319" fill="#475569" font-size="17">点击打开互动汇总</text>
  </g>

